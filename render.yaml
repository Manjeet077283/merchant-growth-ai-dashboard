# ==============================================================================
# Render Blueprint Specification
# Merchant Growth AI — Intelligent Business Agent (PayPal AI Hackathon 2026)
# ==============================================================================

services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: merchant-growth-ai-dashboard
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///./merchant_growth.db
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        value: "https://merchant-growth-ai-dashboard.onrender.com"

  # 2. React + Vite Frontend Static Site
  - type: static
    name: merchant-growth-ai-frontend
    plan: free
    region: oregon
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://merchant-growth-ai-dashboard.onrender.com"
